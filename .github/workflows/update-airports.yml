# Rebuilds data/airports.json from OurAirports' daily export, once a month (or by hand from the Actions tab).
name: Update airport data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_airports.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/airports.json
          git diff --cached --quiet || (git commit -m "Update airport data from OurAirports" && git push)
